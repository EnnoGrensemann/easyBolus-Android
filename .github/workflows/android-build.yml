name: Build easyBOLUS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests & build Debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Upload easyBOLUS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: easyBOLUS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release (für Obtainium)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: easyBOLUS v1.0.${{ github.run_number }}
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
