name: Build easyBOLUS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode Release Keystore (if configured)
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "keystore_path=${{ runner.temp }}/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests & build APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            gradle testDebugUnitTest assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "${{ runner.temp }}/easyBOLUS.apk"
          else
            gradle testDebugUnitTest assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "${{ runner.temp }}/easyBOLUS.apk"
          fi

      - name: Upload easyBOLUS APK
        uses: actions/upload-artifact@v4
        with:
          name: easyBOLUS-apk
          path: ${{ runner.temp }}/easyBOLUS.apk

      - name: Read app versionName
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (für Obtainium)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: easyBOLUS v${{ steps.version.outputs.name }}
          make_latest: true
          files: ${{ runner.temp }}/easyBOLUS.apk
